# Builds the Auto Theremin VST3 (and standalone app) for Windows every time
# you push changes to GitHub. Download the result from the Actions tab.
name: Build Auto Theremin (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'V*' ]           # pushing a tag like v1.0.1 publishes a Release
    paths-ignore: [ '**.md', 'INSTALL.txt' ]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write   # lets the workflow create the GitHub Release

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (downloads JUCE and SDL3 automatically)
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --target AutoTheremin_VST3 AutoTheremin_Standalone --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build/AutoTheremin_artefacts/Release/VST3/Auto Theremin.vst3" package/
          Copy-Item "build/AutoTheremin_artefacts/Release/Standalone/Auto Theremin.exe" package/
          Copy-Item INSTALL.txt package/
          Copy-Item -Recurse Resources/fonts/OFL-*.txt package/

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: AutoTheremin-Windows
          path: package/
          retention-days: 30

      - name: Zip for the release (only when you push a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "AutoTheremin-${{ github.ref_name }}-Windows.zip"

      - name: Publish the GitHub Release (only when you push a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoTheremin-${{ github.ref_name }}-Windows.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Version control: every NEW version number publishes a GitHub Release with
  # the build attached.  Bump VERSION in CMakeLists.txt, push to main, and
  # Release vX.Y.Z appears (notes come from CHANGELOG.md).  The APT Industrial
  # updater on your PC installs the newest Release for FL Studio automatically.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Quality gate: nothing is published until the plugin passes pluginval (the
  # standard plugin test tool, including Steinberg's VST3 validator). It loads
  # the plugin like a DAW, plays audio at many sample rates and block sizes,
  # moves every parameter and saves/restores state.  Fail = no Release, and
  # the updater keeps everyone on the last good version.
  # ---------------------------------------------------------------------------
  test:
    name: Test the plugin before release (pluginval)
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Get the Windows build
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Windows'
          path: dist

      - name: Get pluginval 1.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Test every plugin in the build
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem dist -Recurse -Directory -Filter *.vst3 | Where-Object { $_.Parent.Name -notlike '*.vst3' })
          if ($bundles.Count -eq 0) { throw 'The build contains no .vst3 plugin' }
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null
          $failed = 0
          foreach ($b in $bundles) {
            Write-Host "=== Testing $($b.Name)"
            & .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests --timeout-ms 300000 --output-dir pluginval-logs --validate "$($b.FullName)"
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$($b.Name) FAILED pluginval"; $failed++ } else { Write-Host "$($b.Name) passed" }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-report
          path: pluginval-logs
          retention-days: 30

  release:
    name: Publish this version as a GitHub Release
    needs: [windows, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Is this a new version?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -m1 -oE 'project\([A-Za-z0-9_]+ +VERSION +[0-9]+(\.[0-9]+)+' CMakeLists.txt)
          name=$(echo "$line" | sed -E 's/project\(([A-Za-z0-9_]+).*/\1/')
          ver=$(echo "$line" | grep -oE '[0-9]+(\.[0-9]+)+$')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$ver is already released - nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Publishing v$ver."
          fi

      - name: Get the Windows build
        if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Windows'
          path: dist

      - name: Publish the Release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
          NAME: ${{ steps.v.outputs.name }}
        run: |
          mkdir -p upload
          for d in dist/*/; do n=$(basename "$d"); (cd "$d" && zip -qr "$GITHUB_WORKSPACE/upload/${n}-v${VER}.zip" .); done
          ls -la upload
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VER" '/^## /{ if (p) exit; if (index($0, v)) { p = 1; next } } p' CHANGELOG.md > notes.md
          fi
          [ -s notes.md ] || git log -1 --format=%B "$GITHUB_SHA" > notes.md
          gh release create "v$VER" upload/*.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$NAME v$VER" --notes-file notes.md
